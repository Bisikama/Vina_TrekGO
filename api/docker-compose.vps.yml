# TrekGo - docker compose cho VPS (dùng image từ Docker Hub, không cần source code)
# Trên VPS đặt file này tên docker-compose.yml, cạnh file .env.
#   Chạy:      docker compose up -d
#   Cập nhật:  docker compose pull && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Chỉ mở cho chính VPS (127.0.0.1); dùng SSH tunnel để seed từ máy local
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    # VPS này KHÔNG có AVX -> phải dùng mongo:4.4 (mongo 5+ cần AVX).
    # 4.4 cũng là bản thấp nhất mà driver mongodb 7.x của dự án hỗ trợ.
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # mongo 4.4 dùng lệnh "mongo" (chưa có "mongosh")
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: luatng304/trekgo-api:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Chỉ mở cho chính VPS: truy cập từ ngoài phải đi qua Nginx (cổng 80/443)
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  mongo_data:
  redis_data:
