# =============================================================================
# Build & Push Docker image - TrekGO Web (Next.js)
# Chay khi: push code vao nhanh deploy/docker VA co file trong web/ thay doi.
# Ket qua: image <DOCKERHUB_USERNAME>/trekgo-web tren Docker Hub, roi deploy len VPS.
#
# Dung chung secrets voi workflow API:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (hoac DOCKERHUB_PASSWORD),
#   VPS_HOST, VPS_PORT, VPS_USER, VPS_PASSWORD
#
# Bien (Settings > Secrets and variables > Actions > tab Variables), khong bat buoc:
#   NEXT_PUBLIC_API_URL : URL API nhung vao web luc build
#                         (mac dinh https://api.trekgo.website)
#
# Tren VPS web nam o ~/trekgo-web (tach rieng voi ~/trekgo cua API).
# =============================================================================

name: Docker Image - TrekGO Web

on:
  push:
    branches:
      - deploy/docker
    paths:
      - "web/**"
      - ".github/workflows/web-docker-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: "Build & Push web image"
    runs-on: ubuntu-latest

    steps:
      - name: "Step 1 - Checkout source code"
        uses: actions/checkout@v4

      - name: "Step 2 - Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Step 3 - Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      # latest + sha-xxxxxxx (de quay lai ban cu khi can)
      - name: "Step 4 - Generate image tags"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/trekgo-web
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Chi build amd64 (VPS la amd64) → build Next.js nhanh hon nhieu so voi multi-platform
      # scope=web: tach cache voi image API
      - name: "Step 5 - Build & Push"
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trekgo.website' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: "Deploy web to VPS"
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: "Step 1 - Checkout source code"
        uses: actions/checkout@v4

      - name: "Step 2 - Prepare files"
        run: |
          echo "COMPOSE_B64=$(base64 -w0 web/docker-compose.vps.yml)" >> "$GITHUB_ENV"

      - name: "Step 3 - SSH & redeploy"
        uses: appleboy/ssh-action@v1
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: COMPOSE_B64,DH_USER,DH_TOKEN
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            mkdir -p ~/trekgo-web && cd ~/trekgo-web

            # 1. Cap nhat docker-compose.yml tu repo
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

            # 2. Pull image moi va chay lai
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
            docker compose pull web
            docker compose up -d
            docker image prune -f

            # 3. Kiem tra
            sleep 10
            docker compose ps
            docker compose logs --tail 30 web
            curl -fsS -o /dev/null -w "web HTTP %{http_code}\n" http://127.0.0.1:5000 || echo "web chua phan hoi"
