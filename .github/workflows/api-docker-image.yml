# =============================================================================
# Build & Push Docker image - TrekGO API
# Chay khi: push code vao nhanh deploy/docker VA co file trong api/ thay doi.
# Ket qua: image <DOCKERHUB_USERNAME>/trekgo-api tren Docker Hub.
#
# Chi build thu muc api/ (Dockerfile + build context = ./api).
# web/ va mobile/ KHONG nam trong image, sua chung cung khong kich hoat workflow.
#
# Secrets can co (Settings > Secrets and variables > Actions):
#   - DOCKERHUB_USERNAME : ten tai khoan Docker Hub
#   - DOCKERHUB_TOKEN (hoac DOCKERHUB_PASSWORD): Access Token, tao o
#                          hub.docker.com > Account settings > Personal access tokens
#                          (quyen Read & Write)
#   - TREKGO_ENV         : TOAN BO noi dung file .env DANH CHO VPS (host postgres/mongo/redis).
#                          Moi lan deploy se GHI DE ~/trekgo/.env tren VPS (ban cu luu .env.bak).
#                          De trong = giu nguyen .env dang co tren VPS.
#   - VPS_HOST           : IP VPS (vd 160.30.161.237)
#   - VPS_PORT           : cong SSH (vd 8686)
#   - VPS_USER           : user SSH (vd luatng304)
#   - VPS_PASSWORD       : mat khau SSH cua VPS_USER
#
# Job deploy: sau khi build xong → SSH vao VPS → cap nhat docker-compose.yml
# (tu api/docker-compose.vps.yml) + .env (tu TREKGO_ENV) → pull image moi → up -d.
# =============================================================================

name: Docker Image - TrekGO API

on:
  push:
    branches:
      - deploy/docker
    # Chi chay khi co thay doi trong api/ (hoac chinh file workflow nay)
    paths:
      - "api/**"
      - ".github/workflows/api-docker-image.yml"
  # Cho phep bam "Run workflow" bang tay tren tab Actions
  workflow_dispatch:

# Push nhieu commit lien tiep → huy lan build cu, chi giu lan moi nhat
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: "Build & Push api image"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone code
      - name: "Step 1 - Checkout source code"
        uses: actions/checkout@v4

      # Step 2: QEMU de build duoc image arm64 (Mac chip M) tren may ao amd64
      - name: "Step 2 - Setup QEMU"
        uses: docker/setup-qemu-action@v3

      # Step 3: Buildx - bo build ho tro multi-platform + cache
      - name: "Step 3 - Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # Step 4: Dang nhap Docker Hub bang token (khong dung mat khau)
      - name: "Step 4 - Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # Uu tien DOCKERHUB_TOKEN, khong co thi dung DOCKERHUB_PASSWORD
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      # Step 5: Tao ten tag cho image
      #   - latest      : ban moi nhat
      #   - sha-xxxxxxx : gan voi commit, dung de quay lai ban cu khi ban moi loi
      - name: "Step 5 - Generate image tags"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/trekgo-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 6: Build tu thu muc api/ va push len Docker Hub
      # cache-from/to: type=gha → luu cache layer tren GitHub, lan sau build nhanh hon
      # (vi du chi sua code ma khong doi package.json thi khong phai npm ci lai)
      - name: "Step 6 - Build & Push"
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # JOB 2: Deploy len VPS (chi chay khi build & push thanh cong)
  # ===========================================================================
  deploy:
    name: "Deploy to VPS"
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: "Step 1 - Checkout source code"
        uses: actions/checkout@v4

      # Ma hoa base64 de chuyen file nhieu dong (.env, compose) qua SSH an toan,
      # khong bi loi dau nhay / ky tu dac biet. Gia tri duoc mask, khong hien trong log.
      - name: "Step 2 - Prepare files"
        env:
          TREKGO_ENV: ${{ secrets.TREKGO_ENV }}
        run: |
          ENV_B64=$(printf '%s\n' "$TREKGO_ENV" | tr -d '\r' | base64 -w0)
          if [ -z "$TREKGO_ENV" ]; then ENV_B64=""; fi
          echo "::add-mask::$ENV_B64"
          echo "ENV_B64=$ENV_B64" >> "$GITHUB_ENV"
          echo "COMPOSE_B64=$(base64 -w0 api/docker-compose.vps.yml)" >> "$GITHUB_ENV"

      - name: "Step 3 - SSH & redeploy"
        uses: appleboy/ssh-action@v1
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: ENV_B64,COMPOSE_B64,DH_USER,DH_TOKEN
          # Thoi gian cho ket noi SSH (mac dinh 30s); script tu dung khi loi nho "set -e"
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            mkdir -p ~/trekgo && cd ~/trekgo

            # 1. Cap nhat docker-compose.yml tu repo
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

            # 2. Ghi de .env tu secret TREKGO_ENV (giu ban cu o .env.bak)
            if [ -n "$ENV_B64" ]; then
              [ -f .env ] && cp .env .env.bak
              echo "$ENV_B64" | base64 -d > .env
              chmod 600 .env
              echo ".env updated from TREKGO_ENV"
            else
              echo "TREKGO_ENV empty -> keep existing .env"
            fi

            # 3. Dang nhap Docker Hub (can neu repo private), pull image moi, chay lai
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
            docker compose pull api
            docker compose up -d
            docker image prune -f

            # 4. Kiem tra
            sleep 15
            docker compose ps
            docker compose logs --tail 30 api
