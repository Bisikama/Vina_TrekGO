<script>
  // State Manager
  const state = {
    currentStyle: 'basic',
    colorIndex: 0,
    positionIndex: 0, // 0: bottom, 1: center, 2: top
    colors: ['#ffffff', '#9fe870', '#fed018', '#ff7043'],
    colorNames: ['Trắng tinh', 'Xanh chanh neon', 'Vàng nắng', 'Cam hoàng hôn'],
    positions: ['bottom', 'center', 'top'],
    positionsClasses: {
      bottom: 'bottom-4 top-auto',
      center: 'top-1/2 -translate-y-1/2 bottom-auto',
      top: 'top-16 bottom-auto'
    }
  };

  // 1. Filter Style Selection Logic
  function selectStyle(styleName, buttonEl) {
    state.currentStyle = styleName;

    // Reset thumbnails visual indicators
    document.querySelectorAll('.style-thumb-btn').forEach(btn => {
      const badge = btn.querySelector('.active-badge');
      const label = btn.querySelector('span:last-child');
      if (badge) {
        badge.classList.add('hidden');
        badge.classList.remove('flex');
      }
      if (label) {
        label.classList.remove('text-primary');
        label.classList.add('text-on-surface-variant');
      }
    });

    // Activate selected button indicator
    const currentBadge = buttonEl.querySelector('.active-badge');
    const currentLabel = buttonEl.querySelector('span:last-child');
    if (currentBadge) {
      currentBadge.classList.remove('hidden');
      currentBadge.classList.add('flex');
    }
    if (currentLabel) {
      currentLabel.classList.remove('text-on-surface-variant');
      currentLabel.classList.add('text-primary');
    }

    // Apply overlay transformations to the preview canvas
    const routeTrail = document.getElementById('route-path-trail');
    const startOuter = document.getElementById('route-start-outer');
    const startInner = document.getElementById('route-start-inner');
    const endHalo = document.getElementById('route-end-halo');
    const endDot = document.getElementById('route-end-dot');
    const statsContainer = document.getElementById('stats-overlay-container');
    const statsColumns = document.getElementById('stats-columns');
    const pipMapCard = document.getElementById('pip-map-card');
    const scrimGradient = document.getElementById('scrim-gradient');

    // Default clean reset
    statsContainer.classList.remove('hidden');
    statsColumns.classList.remove('hidden');
    pipMapCard.classList.add('hidden');
    scrimGradient.className = "absolute inset-0 bg-gradient-to-t from-black/75 via-transparent to-black/25 pointer-events-none transition-opacity duration-300";

    switch(styleName) {
      case 'basic':
        setRouteColors('#ffffff');
        break;

      case 'minimal':
        setRouteColors('#ffffff');
        statsColumns.classList.add('hidden');
        break;

      case 'map':
        setRouteColors('#9fe870');
        pipMapCard.classList.remove('hidden');
        break;

      case 'bold':
        setRouteColors('#fed018');
        scrimGradient.className = "absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent pointer-events-none transition-opacity duration-300";
        break;

      case 'journal':
        setRouteColors('#ffffff');
        showToast('Đã áp dụng định dạng Con dấu Nhật ký', 'approval');
        break;
    }
  }

  // 2. Color Cycler
  function setRouteColors(hex) {
    const routeTrail = document.getElementById('route-path-trail');
    const startOuter = document.getElementById('route-start-outer');
    const startInner = document.getElementById('route-start-inner');
    const endHalo = document.getElementById('route-end-halo');
    const endDot = document.getElementById('route-end-dot');
    
    if (routeTrail) routeTrail.setAttribute('stroke', hex);
    if (startOuter) startOuter.setAttribute('stroke', hex);
    if (startInner) startInner.setAttribute('fill', hex);
    if (endHalo) endHalo.setAttribute('fill', hex);
    if (endDot) endDot.setAttribute('fill', hex);
  }

  function cycleRouteColor() {
    state.colorIndex = (state.colorIndex + 1) % state.colors.length;
    const currentColor = state.colors[state.colorIndex];
    setRouteColors(currentColor);

    const indicator = document.getElementById('color-dot-indicator');
    if (indicator) {
      indicator.style.backgroundColor = currentColor;
    }
    showToast(`Đã đổi màu: ${state.colorNames[state.colorIndex]}`, 'palette');
  }

  // 3. Position Cycler
  function cycleOverlayPosition() {
    state.positionIndex = (state.positionIndex + 1) % state.positions.length;
    const pos = state.positions[state.positionIndex];
    const container = document.getElementById('stats-overlay-container');
    const posIcon = document.getElementById('position-icon');

    // Clear position absolute classes
    container.classList.remove('bottom-4', 'top-4', 'top-1/2', '-translate-y-1/2', 'top-16');

    if (pos === 'bottom') {
      container.classList.add('bottom-4');
      posIcon.innerText = 'vertical_align_bottom';
      showToast('Vị trí: Dưới cùng', 'vertical_align_bottom');
    } else if (pos === 'center') {
      container.classList.add('top-1/2', '-translate-y-1/2');
      posIcon.innerText = 'vertical_align_center';
      showToast('Vị trí: Giữa ảnh', 'vertical_align_center');
    } else {
      container.classList.add('top-16');
      posIcon.innerText = 'vertical_align_top';
      showToast('Vị trí: Đầu trang', 'vertical_align_top');
    }
  }

  // 4. Metric toggle details
  let metricMode = 0;
  function toggleMetricDetail() {
    metricMode = (metricMode + 1) % 2;
    const statsCols = document.getElementById('stats-columns');
    if (metricMode === 1) {
      statsCols.innerHTML = `
        <div class="flex flex-col items-center">
          <span class="font-label-sm text-label-sm tracking-wider uppercase opacity-85">Độ cao</span>
          <span class="font-display text-[26px] leading-[30px] font-bold text-white tracking-tight">+420 <span class="text-xs font-medium tracking-normal">m</span></span>
        </div>
        <div class="flex flex-col items-center">
          <span class="font-label-sm text-label-sm tracking-wider uppercase opacity-85">Năng lượng</span>
          <span class="font-display text-[26px] leading-[30px] font-bold text-white tracking-tight">640 <span class="text-xs font-medium tracking-normal">kcal</span></span>
        </div>
        <div class="flex flex-col items-center">
          <span class="font-label-sm text-label-sm tracking-wider uppercase opacity-85">Nhịp tim</span>
          <span class="font-display text-[26px] leading-[30px] font-bold text-white tracking-tight">142 <span class="text-xs font-medium tracking-normal">bpm</span></span>
        </div>
      `;
      showToast('Hiển thị chỉ số mở rộng (Độ cao & Calo)', 'monitor_heart');
    } else {
      statsCols.innerHTML = `
        <div class="flex flex-col items-center">
          <span class="font-label-sm text-label-sm tracking-wider uppercase opacity-85">Quãng đường</span>
          <span class="font-display text-[26px] leading-[30px] font-bold text-white tracking-tight">10 <span class="text-xs font-medium tracking-normal">km</span></span>
        </div>
        <div class="flex flex-col items-center">
          <span class="font-label-sm text-label-sm tracking-wider uppercase opacity-85">Tốc độ TB</span>
          <span class="font-display text-[26px] leading-[30px] font-bold text-white tracking-tight">10:12 <span class="text-xs font-medium tracking-normal">/km</span></span>
        </div>
        <div class="flex flex-col items-center">
          <span class="font-label-sm text-label-sm tracking-wider uppercase opacity-85">Thời gian</span>
          <span class="font-display text-[26px] leading-[30px] font-bold text-white tracking-tight">1:41:59</span>
        </div>
      `;
      showToast('Hiển thị chỉ số mặc định (Quãng đường & Tốc độ)', 'speed');
    }
  }

  // 5. Image Local Upload Replacement
  function handleImageUpload(e) {
    const file = e.target.files && e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        document.getElementById('preview-image').src = event.target.result;
        showToast('Đã cập nhật ảnh nền mới!', 'image');
      };
      reader.readAsDataURL(file);
    }
  }

  // 6. Action Triggers & Toast Notifier
  let toastTimer = null;
  function showToast(message, icon = 'check_circle') {
    const toast = document.getElementById('feedback-toast');
    const toastMsg = document.getElementById('toast-message');
    const toastIcon = document.getElementById('toast-icon');
    
    if (!toast) return;
    toastMsg.innerText = message;
    toastIcon.innerText = icon;
    
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2400);
  }

  function triggerMainShare() {
    if (navigator.share) {
      navigator.share({
        title: 'Chuyến đi TrekGo - Langbiang Alpine Trek',
        text: 'Cung đường tuyệt đẹp 10km vừa hoàn thành trên TrekGo!',
        url: window.location.href
      }).catch(() => {
        showToast('Sẵn sàng chia sẻ câu chuyện!', 'ios_share');
      });
    } else {
      showToast('Đang tạo ảnh chất lượng cao để chia sẻ...', 'ios_share');
    }
  }

  function shareTo(channel) {
    showToast(`Đang kết nối mở ứng dụng ${channel}...`, 'open_in_new');
  }

  function downloadImage() {
    showToast('Đã lưu ảnh có nhãn dán vào Cuộn camera', 'download_done');
  }
</script></main>
